      function balloon(x, y, c, hi) {

      function shop(t, doorOpen) {

        // 粉白遮雨棚

        // 粉藍粉紅小三角旗

        // 大窗：裡面飄著氣球

        // 門
        R(40, 26, 18, 38, "#4A2A1A");

        balloon(37, 20 + Math.round(Math.sin(t * 2) * 0.6), "#F6B7C8", "#FFFFFF");
        balloon(34, 23 + Math.round(Math.sin(t * 2 + 1) * 0.6), "#BFDDF5", "#FFFFFF");
        R(37, 23, 1, 6, "#C9B8A6");
        R(34, 26, 1, 3, "#C9B8A6");
        R(34, 29, 5, 1, "#C9B8A6");
        // 招牌支架
        R(55, 10, 54, 1, "#3B2A1E");
        R(55, 9, 1, 4, "#3B2A1E");
        // 人行道
        R(0, 64, GW, 8, "#D9CFC4");
        for (let x = 0; x < GW; x += 10) R(x, 64, 1, 8, "#C4B8AA");
        R(0, 67, GW, 1, "#C4B8AA");
        R(4, 63, 120, 1, "#B9AC9D");
        // 盆栽（取代小松樹）
        R(114, 56, 9, 8, "#C47A54");
        R(113, 55, 11, 2, "#A9643F");
        R(115, 48, 7, 7, "#5E9E5A");
        R(113, 50, 3, 4, "#4E8A4A");
        R(121, 50, 3, 4, "#4E8A4A");
        R(117, 46, 3, 3, "#6FB46A");

      }
      function poof(cx, cy, p) {
        if (p <= 0 || p >= 1) return;
        const grow = Math.min(1, p / 0.4);
        const fade = p < 0.6 ? 1 : 1 - (p - 0.6) / 0.4;
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2 + hash(i, 3, 3);
          const d = (5 + hash(i, 4, 4) * 8) * grow;
          const r = Math.round((4 + hash(i, 5, 5) * 4) * fade);
          if (r < 2) continue;
          const x0 = Math.round(cx + Math.cos(a) * d * 1.2);
          const y0 = Math.round(cy + Math.sin(a) * d);
          for (let y = -r; y <= r; y++) {
            for (let x = -r; x <= r; x++) {
              const dd = x * x + y * y;
              if (dd > r * r) continue;
              ctx.fillStyle = dd > (r - 1) * (r - 1) ? "#C9C2D3" : "#FFFFFF";
              ctx.fillRect(x0 + x, y0 + y, 1, 1);
            }
          }
        }
      }
      function iris(cx, cy, r) {
        ctx.fillStyle = "#1A1420";
        for (let y = -2; y < GH + 2; y++) {
          const dy = y + 0.5 - cy;
          if (Math.abs(dy) >= r) {
            ctx.fillRect(-2, y, GW + 4, 1);
            continue;
          }
          const hw = Math.round(Math.sqrt(r * r - dy * dy));
          ctx.fillRect(-2, y, Math.round(cx - hw) + 2, 1);
          ctx.fillRect(Math.round(cx + hw), y, GW, 1);
        }
      }
      function walkPose(st, ph, amp) {
        st.legB = Math.sin(ph) * 0.45 * amp;
        st.legF = -Math.sin(ph) * 0.45 * amp;
        st.rock = Math.sin(ph * 2) * 0.04 * amp;
        st.hop = Math.abs(Math.sin(ph)) * 1.2 * amp;
        st.tail = Math.sin(ph) * 0.15;
      }

      // ---------- 時間軸 ----------
      function render(realT) {
        let t = realT;
        let letterU = -1;
        override = null;
        if (realT >= LETTER_AT && realT < LETTER_AT + LETTER_DUR) {
          t = LETTER_AT - 0.001;
          letterU = realT - LETTER_AT;
          override = { head: letterU > 7.65 ? "s_head_happy_bow" : "s_head_open_bow", armRot: -0.45 };
          if (letterU > 7.65) override.hop = Math.max(0, Math.sin(((letterU - 7.65) / 0.3) * Math.PI)) * 1.5;
        } else if (realT >= LETTER_AT + LETTER_DUR) {
          t = realT - LETTER_DUR;
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = "#1A1420";
        ctx.fillRect(0, 0, 1920, 1080);
        let cam;
        let draw;
        if (t < 13) {
          room(t);
          cam = {
            x: path(t, [
              [0.8, 64],
              [2.0, 64, "io"],
              [4.4, 64],
              [5.2, 64, "io"],
              [6.2, 64],
              [7.4, 62, "io"],
              [9.8, 62],
              [10.4, 64, "io"],
              [11.8, 64],
              [12.9, 70, "io"],
            ]),
            y: path(t, [
              [0.8, 36],
              [2.0, 46, "io"],
              [4.4, 46],
              [5.2, 40, "io"],
              [6.2, 40],
              [7.4, 46, "io"],
              [9.8, 46],
              [10.4, 36, "io"],
            ]),
            z: path(t, [
              [0.8, 1],
              [2.0, 1.3, "io"],
              [4.4, 1.3],
              [5.2, 1.1, "io"],
              [6.2, 1.1],
              [7.4, 1.35, "io"],
              [9.8, 1.35],
              [10.4, 1, "io"],
              [11.8, 1],
              [12.9, 1.1, "io"],
            ]),
          };
          draw = () => drawRoomCat(t);
        } else {
          shop(t, tw(t, 13.3, 13.8, 0, 1, "out"));
          cam = {
            x: path(t, [
              [13, 64],
              [15.7, 64],
              [16.4, 80, "io"],
              [17.9, 80],
              [18.9, 82, "io"],
            ]),
            y: path(t, [
              [13, 36],
              [15.7, 36],
              [16.4, 35, "io"],
              [17.9, 35],
              [18.9, 22, "io"],
            ]),
            z: path(t, [
              [13, 1],
              [15.7, 1],
              [16.4, 1.4, "io"],
              [17.9, 1.4],
              [18.9, 2, "io"],
            ]),
          };
          draw = () => drawShopCat(t);
        }
        // 鏡頭：世界座標（格）→ 螢幕
        const z = cam.z;
        const vw = GW / z;
        const vh = GH / z;
        const cx = Math.min(GW - vw / 2, Math.max(vw / 2, cam.x));
        const cy = Math.min(GH - vh / 2, Math.max(vh / 2, cam.y));
        const k = P * z;
        ctx.setTransform(k, 0, 0, k, -(cx - vw / 2) * k, -(cy - vh / 2) * k);
        ctx.drawImage(world, 0, 0, GW, GH);
        draw();
        if (letterU >= 0) drawLetter(letterU);
      }

      // 邀請函：從信封裡長大飛到畫面中央 → 停住讓人讀 → 縮回信封
      function drawLetter(u) {
        const dim = tw(u, 0.1, 0.5, 0, 0.45) * tw(u, 7.2, 7.65, 1, 0);
        ctx.fillStyle = "rgba(26, 20, 32, " + dim.toFixed(3) + ")";
        ctx.fillRect(-2, -2, GW + 4, GH + 4);
        const k = u < 7.2 ? tw(u, 0.15, 0.75, 0, 1, "out") : tw(u, 7.2, 7.65, 1, 0, "in");
        if (k <= 0.01) return;
        const ex = 65;
        const ey = 46;
        piece("letter", (1 - Math.min(1, k)) * -0.5 + pop(u, 0.75, 0.04, 0.6), {
          ax: ex + (64 - ex) * Math.min(1, k),
          ay: ey + (36 - ey) * Math.min(1, k),
          scale: 0.06 + 0.94 * k,
        });
      }

      function drawRoomCat(t) {
        const st = { x: 42, y: 34, view: "front", tail: Math.sin(t * 2) * 0.12 };
        // 正面：包禮物
        const stage = t < 0.8 ? 0 : t < 2.8 ? 1 + Math.min(3, Math.floor((t - 0.8) / 0.5)) : t < 3.0 ? 4 : t < 3.85 ? 5 : 6;
        const giftScale = 1 + pop(t, 3.85, 0.18, 0.5) + pop(t, 3.0, 0.08, 0.4);
        const patL = t > 0.8 && t < 2.9 ? Math.max(0, Math.sin((t - 0.8) * Math.PI * 4)) : 0;
        const patR = t > 0.8 && t < 2.9 ? Math.max(0, Math.sin((t - 0.8) * Math.PI * 4 + Math.PI)) : 0;
        st.pawL = [15, 20 + patL * 1.5];
        st.pawR = [29, 20 + patR * 1.5];
        st.headRot = t < 2.9 ? Math.sin(t * 2.4) * 0.05 : 0;
        if (t >= 4.2) {
          st.head = "f_head_happy";
          st.hop = t < 4.9 ? Math.max(0, Math.sin(((t - 4.3) / 0.5) * Math.PI)) * 5 : 0;
          st.pawL = [13, 16];
          st.pawR = [31, 16];
        }
        st.front = () => piece("gift" + stage, Math.sin(t * 9) * 0.04 * (t > 0.8 && t < 2.8 ? 1 : 0), {
          ax: 22.5,
          ay: 25,
          scale: giftScale,
        });
        // 5.6 起翻面成側面
        let flip = 1;
        if (t >= 5.6 && t < 5.85) flip = tw(t, 5.6, 5.85, 1, 0, "in");
        if (t >= 5.85) {
          st.view = "side";
          st.x = 40;
          st.y = 33;
          st.hop = 0;
          flip = tw(t, 5.85, 6.1, 0, 1, "out");
        }
        st.flip = flip;
        if (st.view === "side") {
          st.torso = "s_torso_flat";
          st.head = "s_head_open";
          st.arm = "s_arm";
          st.armRot = 0;
          st.tail = Math.sin(t * 2) * 0.12;
          // 偷看左右
          if (t >= 6.2 && t < 6.9) st.headRot = t < 6.55 ? -0.18 : 0.12;
          // 禮物位置：手前 → 舉高 → 塞進肚子
          let gx = path(t, [
            [6.8, 29],
            [7.15, 28, "out"],
            [7.55, 24.5, "in"],
          ]);
          let gy = path(t, [
            [6.8, 22],
            [7.15, 15, "back"],
            [7.55, 24, "in"],
          ]);
          const gs = tw(t, 7.15, 7.55, 0.75, 0.45, "in");
          st.armRot = path(t, [
            [6.8, 0.1],
            [7.15, -0.7, "back"],
            [7.55, 0.35, "in"],
          ]);
          const giftDraw = () => piece("gift6", 0, { ax: gx, ay: gy, scale: gs });
          if (t < 7.2) st.hold = null;
          if (t < 7.3) st.behind = null;
          if (t < 7.2) {
            const old = st.arm;
            st.afterArm = giftDraw;
          } else if (t < 7.6) st.behind = giftDraw;
          // 肚子鼓起
          if (t >= 7.6) {
            st.torso = "s_torso_belly";
            st.torsoScale = 1 + pop(t, 7.6, 0.16, 0.6);
            st.hop = pop(t, 7.6, 2, 0.6) > 0 ? pop(t, 7.6, 2, 0.6) : 0;
            st.armRot = -0.25;
          }
          if (t >= 8.0 && t < 9.8) {
            st.head = "s_head_happy";
            st.armRot = -0.25 + Math.sin((t - 8.0) * Math.PI * 2.2) * 0.22;
            st.headRot = Math.sin((t - 8.0) * 3) * 0.05;
          }
          // 換洋裝
          if (t >= 10.45) {
            st.torso = "s_torso_belly_dress";
            st.arm = "s_arm_dress";
            st.armRot = -0.2;
            st.head = t < 10.75 ? "s_head_happy_bow" : "s_head_open_bow";
            st.hop = t > 10.8 && t < 11.1 ? Math.sin(((t - 10.8) / 0.3) * Math.PI) * 2 : 0;
          }
          if (t >= 11.0 && t < 11.5) st.armRot = tw(t, 11.0, 11.4, -0.2, -0.7, "out");
          if (t >= 11.5) {
            st.armRot = tw(t, 11.5, 11.7, -0.7, -0.15, "out");
            st.hold = () => piece("envelope", 0, { ax: 6.2, ay: 2.6, scale: 1 });
          }
          // 往右走
          if (t >= 11.8) {
            st.x = tw(t, 11.8, 12.95, 40, 74, "lin");
            walkPose(st, (t - 11.8) * Math.PI * 3.2, 1);
          }
        }
        if (override) {
          st.head = override.head;
          st.armRot = override.armRot;
          st.hop = override.hop || 0;
        }
        // 側面時把禮物畫在手的後面（舉著）
        if (st.afterArm) {
          const holdFn = st.afterArm;
          st.hold = null;
          drawCat(st);
          ctx.save();
          ctx.translate(st.x, st.y - (st.hop || 0));
          holdFn();
          ctx.restore();
        } else {
          drawCat(st);
        }
        // 特效
        if (t > 3.85 && t < 4.6) {
          const u = tw(t, 3.85, 4.05, 0, 1, "back") * tw(t, 4.35, 4.6, 1, 0, "in");
          piece("sparkle", 0, { ax: 54, ay: 44, scale: u });
          piece("sparkle", 0, { ax: 74, ay: 48, scale: u * 0.8 });
        }
        if (t > 8.2 && t < 9.8) {
          piece("heart", 0, { ax: 72, ay: 34 - (t - 8.2) * 2, scale: tw(t, 8.2, 8.4, 0, 1.4, "back") });
          piece("heart", 0, { ax: 77, ay: 30 - (t - 8.55) * 2, scale: tw(t, 8.55, 8.75, 0, 1, "back") });
        }
        if (t >= 9.8 && t < 10.45) piece("hanger_dress", 0, { ax: 61, ay: tw(t, 9.8, 10.2, -16, 18, "out"), scale: 1.2 });
        poof(61, 50, tw(t, 10.2, 10.8, 0, 1, "lin"));
        if (t >= 11.0 && t < 11.5) {
          const u = (t - 11.0) / 0.5;
          piece("envelope", Math.sin(u * 8) * 0.3, { ax: 72 + Math.sin(u * 6) * 2, ay: 4 + (44 - 4) * E.out(u) });
        }
        if (t >= 12.35) iris(st.x + 22, 46, tw(t, 12.35, 12.9, 80, 0, "in"));
      }

      function drawShopCat(t) {
        const st = { view: "side", x: 28, y: 31, torso: "s_torso_belly_dress", arm: "s_arm_dress", head: "s_head_open_bow" };
        st.tail = Math.sin(t * 2) * 0.12;
        st.armRot = -0.15;
        st.hold = () => piece("envelope", 0, { ax: 6.2, ay: 2.6 });
        // 招牌翻面
        const flip = tw(t, 15.15, 15.6, 0, 1, "io");
        const k = Math.cos(Math.PI * flip);
        const bob = pop(t, 15.6, 1.2, 0.8);
        const signY = 22 + bob;
        const chainW = Math.max(1, 25 * Math.abs(k) - 4);
        ctx.fillStyle = "#7E7468";
        for (let y = 11; y < signY - 10; y += 1) {
          if (y % 2) continue;
          ctx.fillRect(82 - chainW, y, 1, 1);
          ctx.fillRect(82 + chainW - 1, y, 1, 1);
        }
        piece(k >= 0 ? "sign_front" : "sign_back", 0, { ax: 82, ay: signY, sx: Math.max(0.04, Math.abs(k)) });
        if (t < 13.55) {
          // 還在門後
        } else {
          if (t < 14.7) {
            st.x = tw(t, 13.55, 14.7, 28, 61, "lin");
            walkPose(st, (t - 13.55) * Math.PI * 3.2, 1);
          } else {
            st.x = 61;
          }
          // 蹲 → 跳起來拍招牌 → 落地
          if (t >= 14.7 && t < 16) {
            st.hop = path(t, [
              [14.7, 0],
              [14.95, -1, "out"],
              [15.3, 10, "out"],
              [15.65, 0, "in"],
              [15.8, -0.6, "out"],
              [15.95, 0, "out"],
            ]);
            st.armRot = path(t, [
              [14.7, -0.15],
              [14.95, 0.2],
              [15.25, -1.55, "out"],
              [15.5, -1.55],
              [15.9, -0.15, "io"],
            ]);
            st.legB = st.hop > 1 ? 0.35 : 0;
            st.legF = st.hop > 1 ? -0.35 : 0;
            st.headRot = st.hop > 1 ? -0.15 : 0;
          }
          // 轉頭看鏡頭 → 眨眼 → 轉回去
          if (t >= 16.5 && t < 17.85) {
            const turnIn = tw(t, 16.5, 16.62, 1, 0, "in");
            const turnOut = tw(t, 17.7, 17.82, 1, 0, "in");
            if (t < 16.62) {
              st.headSx = turnIn;
            } else if (t < 17.7) {
              st.head = t >= 17.0 && t < 17.6 ? "f_head_wink_bow" : "f_head_open_bow";
              st.headSx = tw(t, 16.62, 16.75, 0, 1, "out");
              st.headRot = t >= 17.0 && t < 17.6 ? 0.08 : 0;
            } else {
              st.head = "f_head_open_bow";
              st.headSx = turnOut;
            }
          }
          // 走出畫面
          if (t >= 17.85) {
            st.x = tw(t, 17.85, 19.0, 61, 128, "in");
            walkPose(st, (t - 17.85) * Math.PI * 3.6, 1);
          }
          drawCat(st);
          if (t >= 17.0 && t < 17.65) {
            const u = tw(t, 17.0, 17.12, 0, 1.6, "back") * tw(t, 17.45, 17.65, 1, 0, "in");
            piece("sparkle", 0, { ax: st.x + 36, ay: st.y + 4, scale: u });
          }
        }
        if (t < 13.5) iris(49, 44, tw(t, 13.05, 13.5, 0, 90, "out"));
      }

      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        state,
        { t: 0 },
        { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(state.t) },
        0,
      );
